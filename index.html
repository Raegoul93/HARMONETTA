<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablatura Harmonetta - Edición por Clic Directo</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; color: #0f172a; text-align: center; }
        p.subtitle { margin-top: 0; color: #64748b; font-size: 0.95rem; text-align: center; }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 980px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Barra de Proyecto */
        .project-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .project-status { font-size: 0.85rem; color: #059669; font-weight: 600; }
        .project-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Información de Canción */
        .meta-input-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 5px; }
        .input-group input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; outline: none; }
        .input-group input:focus { border-color: #2563eb; }

        /* Banner Modo Edición Directa */
        .edit-banner {
            display: none;
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 15px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .edit-banner.active { display: flex; }
        .edit-info { font-weight: 700; color: #92400e; font-size: 0.95rem; }
        .edit-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* Selector Octava */
        .octave-selector-container {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .octave-title { font-weight: 700; font-size: 0.9rem; color: #334155; }
        .octave-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .octave-btn { background: white; border: 2px solid var(--border-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: #475569; transition: all 0.15s; }
        .octave-btn.active { background: #059669; border-color: #047857; color: white; }

        /* Botonera Hexagonal Optimizada para Móviles */
        .board {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            user-select: none;
            background: #1e293b;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }

        .row-container { display: flex; align-items: center; gap: 10px; margin-top: -12px; }
        .row-container:first-child { margin-top: 0; }
        .row-label { font-size: 0.85rem; font-weight: 700; color: #94a3b8; width: 55px; text-align: right; flex-shrink: 0; }
        .row { display: flex; gap: 4px; }

        .hex-wrapper {
            width: 68px; height: 78px; background: #334155;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center; padding: 3px;
            transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-shrink: 0;
        }

        .button-key {
            width: 58px; height: 58px; background: radial-gradient(circle, #475569 0%, #1e293b 100%);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border: 2px solid #64748b; color: white; transition: all 0.15s;
        }

        .hex-wrapper:hover { background: #475569; transform: scale(1.05); z-index: 5; }
        .hex-wrapper:hover .button-key { border-color: #38bdf8; }
        .hex-wrapper.active { background: #2563eb; filter: drop-shadow(0 0 10px #38bdf8); }
        .hex-wrapper.active .button-key { background: radial-gradient(circle, #2563eb 0%, #1e3a8a 100%); border-color: #60a5fa; transform: scale(0.95); }

        .pos-number { font-size: 0.72rem; font-weight: 800; color: #94a3b8; margin-bottom: -2px; }
        .hex-wrapper.active .pos-number { color: #bfdbfe; }
        .note { font-size: 0.95rem; font-weight: bold; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* Reglas Responsivas (iPhone / Móviles) */
        @media screen and (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }

            .board {
                padding: 20px 10px;
                align-items: flex-start;
            }

            .row-container {
                gap: 6px;
                margin-top: -10px;
            }

            .row-label {
                font-size: 0.75rem;
                width: 42px;
            }

            .hex-wrapper {
                width: 52px;
                height: 60px;
            }

            .button-key {
                width: 44px;
                height: 44px;
            }

            .pos-number { font-size: 0.65rem; }
            .note { font-size: 0.8rem; }
        }

        /* Botones de Acción */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        button.action-btn { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.15s; }
        button.action-btn:hover { background: #1d4ed8; }
        button.action-btn.project-btn { background: #4f46e5; }
        button.action-btn.project-btn:hover { background: #4338ca; }
        button.action-btn.bar-btn { background: #d97706; }
        button.action-btn.bar-btn:hover { background: #b45309; }
        button.action-btn.export-btn { background: #059669; }
        button.action-btn.export-btn:hover { background: #047857; }
        button.action-btn.undo-btn { background: #ea580c; }
        button.action-btn.undo-btn:hover { background: #c2410c; }
        button.action-btn.clear { background: #dc2626; }
        button.action-btn.clear:hover { background: #b91c1c; }

        /* Panel TAB Interactivo */
        .tab-panel { background: #0f172a; color: #38bdf8; padding: 20px; border-radius: 8px; overflow-x: auto; box-shadow: inset 0 2px 6px rgba(0,0,0,0.5); }
        .tab-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 10px; }

        .interactive-tab-container {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1rem;
            line-height: 1.35;
            white-space: pre;
            color: #38bdf8;
            font-weight: bold;
        }

        /* Elementos Clicables en la Tablatura */
        .tab-measure-block {
            display: inline-block;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .tab-measure-block:hover {
            background: #1e293b;
            color: #38bdf8;
            outline: 1px dashed #38bdf8;
        }

        .tab-measure-block.selected-edit {
            background: #f59e0b;
            color: #0f172a;
            outline: 2px solid #fbbf24;
        }

        /* Modal Interactivo Flotante */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: white; border-radius: 12px; padding: 22px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
        .modal-card h3 { margin-top: 0; color: #0f172a; margin-bottom: 12px; font-size: 1.1rem; }
        .modal-options { display: flex; flex-direction: column; gap: 8px; }
        .modal-btn { padding: 10px 14px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; font-weight: 700; cursor: pointer; text-align: left; font-size: 0.9rem; transition: all 0.15s; }
        .modal-btn:hover { background: #2563eb; color: white; border-color: #2563eb; }
        .modal-btn.delete:hover { background: #dc2626; border-color: #dc2626; color: white; }
        .modal-btn.cancel { background: transparent; border: none; text-align: center; color: #64748b; margin-top: 5px; }

        @media print {
            body { background: white; color: black; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .project-bar, .octave-selector-container, .board, .controls, .meta-input-container, .subtitle, h1, .edit-banner { display: none !important; }
            .tab-panel { background: white; color: black; box-shadow: none; padding: 0; }
            .interactive-tab-container { color: black; font-size: 0.95rem; }
            .tab-measure-block { background: none !important; outline: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generador de Tablatura Harmonetta</h1>
    <p class="subtitle">Haz clic directo en cualquier compás de la tablatura para modificarlo.</p>

    <div class="project-bar">
        <span class="project-status" id="saveStatus">✓ Archivo listo</span>
        <div class="project-actions">
            <button class="action-btn project-btn" onclick="saveProjectJson()">💾 Guardar</button>
            <button class="action-btn project-btn" onclick="saveProjectAsJson()">📄 Guardar Como...</button>
            <button class="action-btn project-btn" onclick="triggerLoadProject()">📂 Cargar Proyecto</button>
            <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="loadProjectFile(event)">
        </div>
    </div>

    <div class="meta-input-container">
        <div class="input-group">
            <label for="songTitle">Título de la Canción:</label>
            <input type="text" id="songTitle" placeholder="Ej. All of Me" oninput="renderTab()">
        </div>
        <div class="input-group">
            <label for="songArtist">Autor / Intérprete:</label>
            <input type="text" id="songArtist" placeholder="Ej. Gerald Marks" oninput="renderTab()">
        </div>
    </div>

    <!-- Banner Superior para Control de Edición de Compás -->
    <div class="edit-banner" id="editBanner">
        <div class="edit-info" id="editBannerInfo">✏️ Editando Compás Seleccionado</div>
        <div class="edit-controls">
            <button class="action-btn undo-btn" onclick="navChord(-1)">◀ Ant.</button>
            <span id="chordPositionText" style="font-weight: bold; color: #78350f;">Acorde 1 de 4</span>
            <button class="action-btn undo-btn" onclick="navChord(1)">Sig. ▶</button>

            <button class="action-btn export-btn" onclick="updateCurrentEditingChord()" title="Guarda las notas seleccionadas sobre el acorde actual">💾 Actualizar</button>
            <button class="action-btn bar-btn" onclick="insertChordAtCurrentPosition()" title="Inserta las notas seleccionadas en la posición actual">+ Intercalar</button>
            <button class="action-btn bar-btn" onclick="addChordToCurrentEditingMeasureEnd()" title="Añade un acorde nuevo al final de este compás">+ Al Final</button>

            <button class="action-btn clear" onclick="deleteCurrentEditingChord()">🗑️ Borrar</button>
            <button class="action-btn project-btn" onclick="exitEditMode()">✓ Salir</button>
        </div>
    </div>

    <div class="octave-selector-container">
        <span class="octave-title">Posición en la Embocadura (Octava):</span>
        <div class="octave-options">
            <button class="octave-btn" id="oct-B" onclick="selectOctave('B')">Izquierda (Baja - B)</button>
            <button class="octave-btn active" id="oct-M" onclick="selectOctave('M')">Centro (Media - M)</button>
            <button class="octave-btn" id="oct-A" onclick="selectOctave('A')">Derecha (Alta - A)</button>
        </div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button class="action-btn" onclick="addChordToTab()">+ Añadir evento a la TAB</button>
        <button class="action-btn bar-btn" onclick="addBarToTab()">| Insertar barra de compás</button>
        <button class="action-btn undo-btn" onclick="undoLastEvent()">⌫ Deshacer último evento</button>
        <button class="action-btn export-btn" onclick="downloadTxt()">Descargar (.TXT)</button>
        <button class="action-btn export-btn" onclick="printPdf()">Exportar a PDF / Imprimir</button>
        <button class="action-btn clear" onclick="resetTab()">Reiniciar TAB</button>
    </div>

    <div class="tab-panel">
        <div class="tab-title">TABLATURA HARMONETTA (Haz clic en un compás para editar):</div>
        <div class="interactive-tab-container" id="tabOutput"></div>
    </div>
</div>

<!-- Modal Interactivo Directo -->
<div class="modal-overlay" id="measureModal">
    <div class="modal-card">
        <h3 id="modalTitle">Modificar Compás</h3>
        <div class="modal-options">
            <button class="modal-btn" onclick="startEditingSelectedMeasure()">✏️ Editar acordes de este compás</button>
            <button class="modal-btn" onclick="insertMeasure('left')">➕ Agregar compás a la izquierda</button>
            <button class="modal-btn" onclick="insertMeasure('right')">➕ Agregar compás a la derecha</button>
            <button class="modal-btn delete" onclick="deleteSelectedMeasure()">🗑️ Eliminar este compás</button>
            <button class="modal-btn cancel" onclick="closeModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    const layout = [
        [{c:"1-1", pos:"1", n:"D"}, {c:"1-2", pos:"2", n:"F#/Gb"}, {c:"1-3", pos:"3", n:"Bb/A#"}, {c:"1-4", pos:"4", n:"D"}, {c:"1-5", pos:"5", n:"F#/Gb"}, {c:"1-6", pos:"6", n:"Bb/A#"}],
        [{c:"2-1", pos:"1", n:"F"}, {c:"2-2", pos:"2", n:"A"}, {c:"2-3", pos:"3", n:"C#/Db"}, {c:"2-4", pos:"4", n:"F"}, {c:"2-5", pos:"5", n:"A"}, {c:"2-6", pos:"6", n:"C#/Db"}, {c:"2-7", pos:"7", n:"F"}],
        [{c:"3-1", pos:"1", n:"C"}, {c:"3-2", pos:"2", n:"E"}, {c:"3-3", pos:"3", n:"G#/Ab"}, {c:"3-4", pos:"4", n:"C"}, {c:"3-5", pos:"5", n:"E"}, {c:"3-6", pos:"6", n:"G#/Ab"}],
        [{c:"4-1", pos:"1", n:"D#/Eb"}, {c:"4-2", pos:"2", n:"G"}, {c:"4-3", pos:"3", n:"B"}, {c:"4-4", pos:"4", n:"D#/Eb"}, {c:"4-5", pos:"5", n:"G"}, {c:"4-6", pos:"6", n:"B"}, {c:"4-7", pos:"7", n:"D#/Eb"}],
        [{c:"5-1", pos:"1", n:"Bb/A#"}, {c:"5-2", pos:"2", n:"D"}, {c:"5-3", pos:"3", n:"F#/Gb"}, {c:"5-4", pos:"4", n:"Bb/A#"}, {c:"5-5", pos:"5", n:"D"}, {c:"5-6", pos:"6", n:"F#/Gb"}]
    ];

    let selectedKeys = [];
    let currentOctave = 'M';
    let tabHistory = [];

    let fileHandle = null;

    // Variables de Estado de Edición
    let selectedMeasureIndex = null;
    let editingChordOffset = 0;
    let isEditMode = false;

    const MAX_LINE_CHARS = 72;
    const MIN_SLOTS_PER_BAR = 4;

    function selectOctave(oct) {
        currentOctave = oct;
        document.querySelectorAll('.octave-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`oct-${oct}`).classList.add('active');
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';

        layout.forEach((row, rowIndex) => {
            const rowContainer = document.createElement('div');
            rowContainer.className = 'row-container';

            const labelEl = document.createElement('div');
            labelEl.className = 'row-label';
            labelEl.textContent = `Fila ${rowIndex + 1}`;
            rowContainer.appendChild(labelEl);

            const rowEl = document.createElement('div');
            rowEl.className = 'row';

            row.forEach(btn => {
                const isSelected = selectedKeys.includes(btn.c);
                const hexWrapper = document.createElement('div');
                hexWrapper.className = 'hex-wrapper' + (isSelected ? ' active' : '');
                hexWrapper.onclick = () => toggleKey(btn.c);

                const btnEl = document.createElement('div');
                btnEl.className = 'button-key';
                btnEl.innerHTML = `
                    <span class="pos-number">${btn.pos}</span>
                    <span class="note">${btn.n}</span>
                `;

                hexWrapper.appendChild(btnEl);
                rowEl.appendChild(hexWrapper);
            });

            rowContainer.appendChild(rowEl);
            boardEl.appendChild(rowContainer);
        });
    }

    function toggleKey(coord) {
        if (selectedKeys.includes(coord)) {
            selectedKeys = selectedKeys.filter(c => c !== coord);
        } else {
            selectedKeys.push(coord);
        }
        renderBoard();
    }

    function clearSelection() {
        selectedKeys = [];
        renderBoard();
    }

    function buildStepMapFromSelectedKeys() {
        let stepMap = {1: [], 2: [], 3: [], 4: [], 5: []};
        selectedKeys.forEach(coord => {
            const [row, col] = coord.split('-').map(Number);
            stepMap[row].push(col);
        });
        return stepMap;
    }

    function addChordToTab() {
        if (selectedKeys.length === 0) return;
        tabHistory.push({ type: 'chord', octave: currentOctave, stepMap: buildStepMapFromSelectedKeys() });
        clearSelection();
        renderTab();
    }

    function addBarToTab() {
        tabHistory.push({ type: 'bar' });
        renderTab();
    }

    function undoLastEvent() {
        if (tabHistory.length > 0) {
            tabHistory.pop();
            renderTab();
        }
    }

    /* ---- LÓGICA DE COMPASES ---- */

    function getMeasuresList() {
        let measures = [];
        let currentEvents = [];
        let startIndex = 0;

        tabHistory.forEach((event, idx) => {
            if (event.type === 'bar') {
                measures.push({ events: currentEvents, startIndex: startIndex, endIndex: idx, hasBar: true });
                currentEvents = [];
                startIndex = idx + 1;
            } else {
                currentEvents.push({ event, globalIndex: idx });
            }
        });

        if (currentEvents.length > 0 || tabHistory.length === 0) {
            measures.push({ events: currentEvents, startIndex: startIndex, endIndex: tabHistory.length - 1, hasBar: false });
        }
        return measures;
    }

    function openMeasureModal(measureIdx) {
        selectedMeasureIndex = measureIdx;
        document.getElementById('modalTitle').textContent = `Compás ${measureIdx + 1}`;
        document.getElementById('measureModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('measureModal').classList.remove('active');
    }

    function startEditingSelectedMeasure() {
        closeModal();
        if (selectedMeasureIndex === null) return;
        isEditMode = true;
        editingChordOffset = 0;
        document.getElementById('editBanner').classList.add('active');
        loadEditingChordToBoard();
        renderTab();
    }

    function loadEditingChordToBoard() {
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];

        document.getElementById('editBannerInfo').textContent = `✏️ Editando Compás ${selectedMeasureIndex + 1}`;

        if (!m || m.events.length === 0) {
            document.getElementById('chordPositionText').textContent = "Compás Vacío";
            selectedKeys = [];
            renderBoard();
            return;
        }

        if (editingChordOffset < 0) editingChordOffset = 0;
        if (editingChordOffset >= m.events.length) editingChordOffset = m.events.length - 1;

        document.getElementById('chordPositionText').textContent = `Acorde ${editingChordOffset + 1} de ${m.events.length}`;

        const targetChord = m.events[editingChordOffset].event;
        selectOctave(targetChord.octave);

        selectedKeys = [];
        for (let r = 1; r <= 5; r++) {
            targetChord.stepMap[r].forEach(col => {
                selectedKeys.push(`${r}-${col}`);
            });
        }
        renderBoard();
    }

    function updateCurrentEditingChord() {
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];
        if (!m || m.events.length === 0) return;

        const globalIdx = m.events[editingChordOffset].globalIndex;
        tabHistory[globalIdx] = { type: 'chord', octave: currentOctave, stepMap: buildStepMapFromSelectedKeys() };
        renderTab();
    }

    function insertChordAtCurrentPosition() {
        if (selectedKeys.length === 0) return;
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];

        let targetGlobalIdx;
        if (!m || m.events.length === 0) {
            targetGlobalIdx = m ? m.startIndex : tabHistory.length;
        } else {
            targetGlobalIdx = m.events[editingChordOffset].globalIndex;
        }

        tabHistory.splice(targetGlobalIdx, 0, {
            type: 'chord',
            octave: currentOctave,
            stepMap: buildStepMapFromSelectedKeys()
        });

        renderTab();
        loadEditingChordToBoard();
    }

    function addChordToCurrentEditingMeasureEnd() {
        if (selectedKeys.length === 0) return;
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];

        let insertPos = m.hasBar ? m.endIndex : tabHistory.length;

        tabHistory.splice(insertPos, 0, {
            type: 'chord',
            octave: currentOctave,
            stepMap: buildStepMapFromSelectedKeys()
        });

        renderTab();
        editingChordOffset = m.events.length;
        loadEditingChordToBoard();
    }

    function navChord(dir) {
        editingChordOffset += dir;
        loadEditingChordToBoard();
    }

    function deleteCurrentEditingChord() {
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];
        if (!m || m.events.length === 0) return;

        const globalIdx = m.events[editingChordOffset].globalIndex;
        tabHistory.splice(globalIdx, 1);

        renderTab();
        if (editingChordOffset > 0) editingChordOffset--;
        loadEditingChordToBoard();
    }

    function exitEditMode() {
        isEditMode = false;
        selectedMeasureIndex = null;
        document.getElementById('editBanner').classList.remove('active');
        clearSelection();
        renderTab();
    }

    function insertMeasure(direction) {
        closeModal();
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];
        let insertIdx = (direction === 'left') ? m.startIndex : (m.endIndex + 1);

        tabHistory.splice(insertIdx, 0, { type: 'bar' });
        renderTab();
    }

    function deleteSelectedMeasure() {
        closeModal();
        const measures = getMeasuresList();
        const m = measures[selectedMeasureIndex];

        let deleteCount = m.endIndex - m.startIndex + 1;
        tabHistory.splice(m.startIndex, deleteCount);
        if (isEditMode) exitEditMode();
        else renderTab();
    }

    /* ---- RENDERIZADO ---- */

    function renderTab() {
        const title = document.getElementById('songTitle').value.trim() || 'Sin Título';
        const artist = document.getElementById('songArtist').value.trim() || 'Desconocido';

        let header = `========================================================\n`;
        header += `CANCIÓN: ${title}\n`;
        header += `AUTOR/A: ${artist}\n`;
        header += `========================================================\n\n`;

        const tabOutputEl = document.getElementById('tabOutput');
        tabOutputEl.innerHTML = '';

        const headerPre = document.createElement('div');
        headerPre.textContent = header;
        tabOutputEl.appendChild(headerPre);

        if (tabHistory.length === 0) {
            let emptyTab = "";
            for (let r = 1; r <= 5; r++) emptyTab += `F${r}  |-----------------------------------\n`;
            emptyTab += "Oct |-----------------------------------\n";
            const emptyPre = document.createElement('div');
            emptyPre.textContent = emptyTab;
            tabOutputEl.appendChild(emptyPre);
            saveLocalStorage();
            return;
        }

        let rawMeasures = [];
        let currentMeasure = [];

        tabHistory.forEach(event => {
            if (event.type === 'bar') {
                rawMeasures.push(currentMeasure);
                currentMeasure = [];
            } else {
                currentMeasure.push(event);
            }
        });
        if (currentMeasure.length > 0) rawMeasures.push(currentMeasure);

        let processedMeasures = rawMeasures.map((measureEvents, mIdx) => {
            let measureData = { oct: "", 1: "", 2: "", 3: "", 4: "", 5: "", charWidth: 0, index: mIdx };

            measureEvents.forEach(event => {
                let maxContentLen = 1;
                for (let r = 1; r <= 5; r++) {
                    const comboStr = event.stepMap[r].join('');
                    if (comboStr.length > maxContentLen) maxContentLen = comboStr.length;
                }

                const cellWidth = maxContentLen + 2;
                const octPadding = cellWidth - 1 - event.octave.length;
                measureData.oct += `-${event.octave}` + "-".repeat(Math.max(1, octPadding));

                for (let r = 1; r <= 5; r++) {
                    const combo = event.stepMap[r].join('');
                    if (combo.length === 0) {
                        measureData[r] += "-".repeat(cellWidth);
                    } else {
                        const rowPadding = cellWidth - 1 - combo.length;
                        measureData[r] += `-${combo}` + "-".repeat(Math.max(1, rowPadding));
                    }
                }
                measureData.charWidth += cellWidth;
            });

            const emptySlots = Math.max(0, MIN_SLOTS_PER_BAR - measureEvents.length);
            for (let s = 0; s < emptySlots; s++) {
                measureData.oct += "----";
                for (let r = 1; r <= 5; r++) measureData[r] += "----";
                measureData.charWidth += 4;
            }

            measureData.oct += "|";
            for (let r = 1; r <= 5; r++) measureData[r] += "|";
            measureData.charWidth += 1;

            return measureData;
        });

        const prefixLen = 5;
        let systems = [];
        let currentSystem = [];
        let currentSystemChars = prefixLen;
        let barInSystemCount = 0;

        processedMeasures.forEach(m => {
            if ((currentSystemChars + m.charWidth > MAX_LINE_CHARS && currentSystem.length > 0) || barInSystemCount >= 4) {
                systems.push(currentSystem);
                currentSystem = [m];
                currentSystemChars = prefixLen + m.charWidth;
                barInSystemCount = 1;
            } else {
                currentSystem.push(m);
                currentSystemChars += m.charWidth;
                barInSystemCount++;
            }
        });
        if (currentSystem.length > 0) systems.push(currentSystem);

        systems.forEach(system => {
            const systemDiv = document.createElement('div');
            systemDiv.style.marginBottom = '15px';

            let lineKeys = ['1', '2', '3', '4', '5', 'oct'];
            let lineLabels = { 1: 'F1  |', 2: 'F2  |', 3: 'F3  |', 4: 'F4  |', 5: 'F5  |', oct: 'Oct |' };

            lineKeys.forEach(k => {
                const lineRow = document.createElement('div');
                const labelSpan = document.createElement('span');
                labelSpan.textContent = lineLabels[k];
                lineRow.appendChild(labelSpan);

                system.forEach(m => {
                    const blockSpan = document.createElement('span');
                    blockSpan.className = 'tab-measure-block' + (isEditMode && selectedMeasureIndex === m.index ? ' selected-edit' : '');
                    blockSpan.textContent = m[k];
                    blockSpan.onclick = () => openMeasureModal(m.index);
                    lineRow.appendChild(blockSpan);
                });

                systemDiv.appendChild(lineRow);
            });

            tabOutputEl.appendChild(systemDiv);
        });

        saveLocalStorage();
    }

    /* ---- GUARDADO Y PROYECTO ---- */

    async function saveProjectJson() {
        if (fileHandle) {
            try {
                const title = document.getElementById('songTitle').value.trim() || 'Proyecto_Harmonetta';
                const artist = document.getElementById('songArtist').value.trim() || '';
                const data = { title, artist, tabHistory };

                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(data, null, 2));
                await writable.close();

                updateStatus(`✓ Guardado sobre ${fileHandle.name}`);
                return;
            } catch (err) {
                console.warn("Reabriendo archivo...", err);
            }
        }
        saveProjectAsJson();
    }

    async function saveProjectAsJson() {
        const title = document.getElementById('songTitle').value.trim() || 'Proyecto_Harmonetta';
        const artist = document.getElementById('songArtist').value.trim() || '';
        const data = { title, artist, tabHistory };

        if ('showSaveFilePicker' in window) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: `${title.replace(/\s+/g, '_')}.json`,
                    types: [{ description: 'Proyecto Harmonetta', accept: { 'application/json': ['.json'] } }]
                });
                const writable = await handle.createWritable();
                await writable.write(JSON.stringify(data, null, 2));
                await writable.close();
                fileHandle = handle;
                updateStatus(`✓ Guardado como ${fileHandle.name}`);
                return;
            } catch (err) {
                if (err.name === 'AbortError') return;
            }
        }

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${title.replace(/\s+/g, '_')}_proyecto.json`;
        link.click();
    }

    async function triggerLoadProject() {
        if ('showOpenFilePicker' in window) {
            try {
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'Proyecto Harmonetta', accept: { 'application/json': ['.json'] } }],
                    multiple: false
                });
                const file = await handle.getFile();
                const text = await file.text();
                const data = JSON.parse(text);

                if (data.tabHistory && Array.isArray(data.tabHistory)) {
                    document.getElementById('songTitle').value = data.title || '';
                    document.getElementById('songArtist').value = data.artist || '';
                    tabHistory = data.tabHistory;
                    fileHandle = handle;
                    renderTab();
                    updateStatus(`✓ Proyecto cargado: ${fileHandle.name}`);
                }
                return;
            } catch (err) {
                if (err.name === 'AbortError') return;
            }
        }
        document.getElementById('fileInput').click();
    }

    function loadProjectFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.tabHistory && Array.isArray(data.tabHistory)) {
                    document.getElementById('songTitle').value = data.title || '';
                    document.getElementById('songArtist').value = data.artist || '';
                    tabHistory = data.tabHistory;
                    fileHandle = null;
                    renderTab();
                    updateStatus(`✓ Proyecto cargado: ${file.name}`);
                }
            } catch (err) {
                alert('Error al leer el archivo JSON.');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function updateStatus(msg) {
        const statusEl = document.getElementById('saveStatus');
        if (statusEl) statusEl.textContent = msg;
    }

    function saveLocalStorage() {
        const title = document.getElementById('songTitle').value;
        const artist = document.getElementById('songArtist').value;
        const data = { title, artist, tabHistory };
        localStorage.setItem('harmonetta_current_draft', JSON.stringify(data));
    }

    function loadLocalStorage() {
        const saved = localStorage.getItem('harmonetta_current_draft');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                document.getElementById('songTitle').value = data.title || '';
                document.getElementById('songArtist').value = data.artist || '';
                tabHistory = data.tabHistory || [];
            } catch (e) {}
        }
    }

    function downloadTxt() {
        const title = document.getElementById('songTitle').value.trim() || 'Tablatura_Harmonetta';
        const text = document.getElementById('tabOutput').innerText;
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${title.replace(/\s+/g, '_')}.txt`;
        link.click();
    }

    function printPdf() { window.print(); }

    function resetTab() {
        if (confirm('¿Estás seguro de reiniciar? Se borrará el borrador actual.')) {
            tabHistory = [];
            fileHandle = null;
            document.getElementById('songTitle').value = '';
            document.getElementById('songArtist').value = '';
            clearSelection();
            localStorage.removeItem('harmonetta_current_draft');
            renderTab();
            updateStatus('✓ Borrador reiniciado');
        }
    }

    loadLocalStorage();
    renderBoard();
    renderTab();
</script>
